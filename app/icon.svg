<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark carbon rounded container -->
  <rect width="64" height="64" rx="14" fill="#101114"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#17B4C9" stroke-width="2" stroke-opacity="0.85"/>

  <!-- Gun main barrel & body -->
  <path d="M14 21h24v10h-6l-3 17h-8l2-17h-9v-10z" fill="#17B4C9"/>

  <!-- Gun detail line -->
  <rect x="18" y="24" width="8" height="2" rx="1" fill="#101114" fill-opacity="0.3"/>

  <!-- Red nozzle tip -->
  <rect x="38" y="23" width="6" height="6" rx="0.5" fill="#E23E2E"/>

  <!-- Red trigger -->
  <rect x="29" y="32" width="2.5" height="5" rx="1" fill="#E23E2E"/>

  <!-- High-velocity spray stream -->
  <path d="M46 24l9-5" stroke="#17B4C9" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M46 26h10" stroke="#F3F1EC" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M46 28l9 5" stroke="#17B4C9" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 48V Battery pack at base -->
  <rect x="16" y="48" width="18" height="7" rx="1.5" fill="#17191D" stroke="#E23E2E" stroke-width="1.5"/>
  <!-- Red release latch on battery -->
  <rect x="23" y="46.5" width="4" height="2" rx="0.5" fill="#E23E2E"/>
</svg>
